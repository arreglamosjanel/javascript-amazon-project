<!DOCTYPE html>
<html>
  <head>
    <title>Variables</title>
    
  </head>

  <body>
   
    <script>

      // use let to create new variables
      // console.log is to show the value of the variables
      let variable1 = 3;
      console.log(variable1);
      
      // const is another way to declare variables
      // const means constant, can't be re-assign
      // we use const by default
      const calculation = 2 + 2;
      console.log(calculation);
      console.log(calculation + 2)

      const result = calculation + 2;
      console.log(result);

      const message = 'Hello'
      console.log(message); console.log(';');

      // re-assign variables
      variable1 = 5;
      console.log(variable1);

      // add the value of the variables
      variable1 = variable1 + 1;
      console.log(variable1);

      // const is another way to declare variables
      // using let to declare variable can be re-assign
      const variable2 = 3;

      /*var is also an another way to declare variable 
        it is the same as let, can be change
        it is the original way to declare variable
      */
      var variable3 = 3;

      /* "typeof" will tell us what type of the value inside
          the variable
      */
      console.log(typeof variable2);
      console.log(typeof message);
      
    </script>

  </body>
</html>
