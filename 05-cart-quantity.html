<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
    
  </head>
  <body>
    <button onclick="
        console.log(`Cart Quantity: ${CartQuantity}
        `);
      ">Show Quantity</button>

    <button onclick="
      // CartQuantity = CartQuantity + 1;
      // CartQuantity += 1;
      // above is the shortcut below
      CartQuantity++;
      console.log(`Cart Quantity: ${CartQuantity}
        `);
    ">Add to Cart</button>

    <button onclick="
      // CartQuantity = CartQuantity + 2;
      // below code is the shortcut above
      CartQuantity += 2;
      console.log(`Cart Quantity: ${CartQuantity}
        `);
    ">+2</button>

    <button onclick="
      // CartQuantity = CartQuantity + 3;
      CartQuantity += 3;
      console.log(`Cart Quantity: ${CartQuantity}
        `);
    ">+3</button>

    <button onclick="
      CartQuantity = 0;
      alert('cart was reset.');
      console.log(`Cart Quantity: ${CartQuantity}
        `);
    ">Reset Cart</button>

    <script>
      // variables
      let CartQuantity = 0;
    </script>

  </body>
</html>
