<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissor myown</title>
    <p>Rock paper Scissor</p>
    <button onclick="
      playGame('Rock')
    ">Rock</button>

    <button onclick="
      playGame('Paper')
    ">Paper</button>

    <button onclick="
      playGame('Scissor')
    ">Scissor</button>

    <button onclick="
      score.Wins = 0,
      score.Losses = 0,
      score.Tie = 0
      localStorage.removeItem('score');
    ">reset</button>


    <script>
      const score = JSON.parse(localStorage.getItem('score')) || {
        Wins: 0,
        Losses: 0,
        Tie: 0
      };

      function playGame(playerMove) {
        const computerMove = pickComputerMove();

        let result = '';


        if (playerMove === 'Rock') {
          if (computerMove === 'Rock') {
            result = 'Tie.';
          } else if (computerMove === 'Paper') {
            result = 'You lose.';
          } else if (computerMove === 'Scissor') {
            result = 'You win.';
          }

        } else if (playerMove === 'Paper') {
          if (computerMove === 'Rock') {
            result = 'You win.';
          } else if (computerMove === 'Paper') {
            result = 'Tie.';
          } else if (computerMove === 'Scissor') {
            result = 'You lose.'
          }

        } else if (playerMove === 'Scissor') {
          if (computerMove === 'Rock') {
            result = 'You lose.';
          } else if (computerMove === 'Paper') {
            result = 'You win.';
          } else if (computerMove === 'Scissor') {
            result = 'Tie.'
          }
        }
        if (result === 'You win.') {
          score.Wins += 1;
        } else if (result === 'You lose.') {
          score.Losses += 1;
        } else if (result === 'Tie.') {
          score.Tie += 1;
        }

        localStorage.setItem('score', JSON.stringify(score));

        alert(`You piked ${playerMove}. Computer picked ${computerMove}. ${result}.
Wins: ${score.Wins}, Losses: ${score.Losses}, Tie: ${score.Tie}`);
      }



      function pickComputerMove() {
        const randomNumber = Math.random();

        let computerMove = '';

        if (randomNumber >= 0 && randomNumber < 1 / 3) {
          computerMove = 'Rock';
        } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
          computerMove = 'Paper';
        }else if (randomNumber >= 2 / 3 && randomNumber < 1) {
          computerMove = 'Scissor';
        }

        return computerMove;
      }

    </script>
  </head>
</html>
