<!DOCTYPE html>
<html>
  <head>
    <title>Practice Code</title>
  </head>
  <body>
    <button onclick="
        console.log(`Cart Quantity: ${variable1}`)
      ">Cart Quantity</button>

    <button onclick="
      variable1 ++;
      console.log(`Cart Quantity: ${variable1}`)
    ">Add to Cart</button>

    <button onclick="
      variable1 += 2;
      console.log(`Cart Quantity: ${variable1}`)
    ">Plus Two</button>

    <button onclick="
      variable1 += 3;
      console.log(`Cart Quantity: ${variable1}`)
    ">Plus Three</button>

    <button onclick="
      variable1 = 0;
      alert('Cart Was Reset')
      console.log(`Cart Quantity: ${variable1}`)
    ">Reset Button</button>

    <script>
      var variable1 = 0;
    </script>
  </body>
</html>
